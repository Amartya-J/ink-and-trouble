<!doctype html><html lang="en"><meta charset="utf-8"><title>Ink & Trouble · Art verification gallery</title><style>body{background:#eee5d0;color:#292b25;font:16px Georgia;margin:24px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}canvas{width:100%;border:1px solid #292b25}h2{font-size:18px}#status{font:14px monospace}</style><h1>Campaign art verification</h1><p id="status">Rendering all 15 stages…</p><main id="gallery"></main><script type="module">

</script></html>
